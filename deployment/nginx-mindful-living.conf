# Nginx config for Mindful Living - Server Satya Tech (Hostinger)
# Server IP: 187.124.129.55
# Place this in: /etc/nginx/sites-available/mindful-living
# Then symlink: sudo ln -s /etc/nginx/sites-available/mindful-living /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name 187.124.129.55;

    root /var/www/mindful-living/frontend;
    index index.html;

    # Frontend - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html to ensure updates are visible immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Uploaded media must reach the backend rather than the SPA fallback.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
